name: flutter_decision_making
description: "Flutter package for multi-criteria decision-making using AHP, SAW, and TOPSIS algorithms."
version: 2.0.0
homepage: https://github.com/hendriari/flutter_decision_making
repository: https://github.com/hendriari/flutter_decision_making/tree/main/packages/decision_making_core
issue_tracker: https://github.com/hendriari/flutter_decision_making/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  decision_making_core: ^0.1.0
  synchronized: ^3.4.0
  uuid: ^4.5.2

dependency_overrides:
  decision_making_core:
    path: packages/decision_making_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - mcdm
  - decision-support-system
  - ahp
  - topsis

funding:
  - https://github.com/hendriari/flutter_decision_making