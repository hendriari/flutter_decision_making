name: flutter_decision_making
description: "Flutter package for multi-criteria decision-making using AHP, SAW, and TOPSIS algorithms."
version: 2.1.0
homepage: https://github.com/hendriari/flutter_decision_making
repository: https://github.com/hendriari/flutter_decision_making
issue_tracker: https://github.com/hendriari/flutter_decision_making/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  decision_making_core: ^0.2.1
  synchronized: ^3.4.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - mcdm
  - decision-support-system
  - ahp
  - topsis
  - saw

funding:
  - https://github.com/hendriari/flutter_decision_making